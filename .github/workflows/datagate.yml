name: DataGate CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME || 'testdb' }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER || 'testuser' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testpass' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Integration tests
      run: go test -v -tags=integration ./...
      env:
        TEST_DB_HOST: localhost
        TEST_DB_PORT: 5432
        TEST_DB_NAME: ${{ secrets.TEST_DB_NAME || 'testdb' }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER || 'testuser' }}
        TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testpass' }}
